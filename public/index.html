<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Interactive multi-page document viewer.">
  <title>Document Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

:root {
  --bg-color: #090d16;
  --bg-gradient: radial-gradient(circle at 50% 20%, #172238 0%, #090d16 80%);
  --surface-glass: rgba(18, 25, 41, 0.88);
  --surface-border: rgba(255, 255, 255, 0.14);
  --primary: #3b82f6;
  --primary-hover: #2563eb;
  --primary-glow: rgba(59, 130, 246, 0.45);
  --text-primary: #f8fafc;
  --text-secondary: #94a3b8;
  --paper-bg: #ffffff;
  --paper-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.08);
  --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-color);
  background-image: var(--bg-gradient);
  min-height: 100vh;
  color: var(--text-primary);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  overflow-x: hidden;
  user-select: none;
}

/* Main Viewer Layout - Snug and centered with minimal top spacing */
.viewer-main {
  width: 100%;
  max-width: 1300px;
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
  padding: 14px 90px 80px 90px;
}

/* Big Navigation Arrow Buttons */
.nav-arrow {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: rgba(18, 25, 41, 0.88);
  backdrop-filter: blur(16px);
  border: 1.5px solid rgba(255, 255, 255, 0.16);
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 100;
  transition: var(--transition-smooth);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
  text-decoration: none;
  outline: none;
}

.nav-arrow svg {
  width: 28px;
  height: 28px;
  stroke: #ffffff;
  stroke-width: 2.6;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
  transition: transform 0.25s ease;
}

.nav-arrow.prev-arrow {
  left: 32px;
}

.nav-arrow.prev-arrow:hover svg {
  transform: translateX(-4px);
}

.nav-arrow.next-arrow {
  right: 32px;
}

.nav-arrow.next-arrow:hover svg {
  transform: translateX(4px);
}

.nav-arrow:hover {
  background: var(--primary);
  border-color: #93c5fd;
  transform: translateY(-50%) scale(1.1);
  box-shadow: 0 14px 35px var(--primary-glow);
}

.nav-arrow:active {
  transform: translateY(-50%) scale(0.96);
}

/* Tooltip on arrow buttons */
.nav-arrow::after {
  content: attr(data-tooltip);
  position: absolute;
  top: calc(100% + 10px);
  left: 50%;
  transform: translateX(-50%) scale(0.85);
  opacity: 0;
  pointer-events: none;
  background: #0f172a;
  border: 1px solid rgba(255, 255, 255, 0.15);
  color: #f8fafc;
  font-size: 0.74rem;
  font-weight: 600;
  padding: 5px 10px;
  border-radius: 6px;
  white-space: nowrap;
  transition: var(--transition-smooth);
  box-shadow: 0 8px 20px rgba(0,0,0,0.5);
}

.nav-arrow:hover::after {
  opacity: 1;
  transform: translateX(-50%) scale(1);
}

/* Hide arrow when not applicable */
.nav-arrow.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transform: translateY(-50%) scale(0.65);
}

/* Document Stage */
.document-stage {
  position: relative;
  width: 100%;
  max-width: 840px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.document-card {
  width: 100%;
  background: var(--paper-bg);
  border-radius: 10px;
  overflow: hidden;
  box-shadow: var(--paper-shadow);
  border: 1px solid rgba(255, 255, 255, 0.08);
  position: relative;
  transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
}

/* Pages in interactive mode */
.document-page {
  display: none;
  width: 100%;
  opacity: 0;
  transform: translateY(12px) scale(0.99);
  transition: opacity 0.35s ease, transform 0.35s ease;
}

.document-page.active {
  display: block;
  opacity: 1;
  transform: translateY(0) scale(1);
}

.image-canvas {
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #ffffff;
  padding: 6px;
  overflow: hidden;
  position: relative;
}

.page-display-img {
  width: 100%;
  height: auto;
  display: block;
  object-fit: contain;
  border-radius: 4px;
  image-rendering: -webkit-optimize-contrast;
  transition: transform 0.2s ease-out;
  cursor: zoom-in;
}

.page-display-img.zoomed {
  cursor: zoom-out;
}

/* Bottom Floating Control Dock */
.control-dock {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 16px;
  background: rgba(15, 23, 42, 0.88);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.14);
  padding: 8px 18px;
  border-radius: 9999px;
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
  z-index: 100;
}

.page-counter-badge {
  font-size: 0.86rem;
  font-weight: 700;
  color: #f1f5f9;
  padding: 4px 12px;
  border-radius: 9999px;
  background: rgba(255, 255, 255, 0.1);
  letter-spacing: 0.02em;
}

.pagination-dots {
  display: flex;
  align-items: center;
  gap: 6px;
}

.page-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.25);
  cursor: pointer;
  transition: var(--transition-smooth);
  display: inline-block;
}

.page-dot.active {
  width: 24px;
  border-radius: 9999px;
  background: var(--primary);
  box-shadow: 0 0 12px var(--primary-glow);
}

.dock-separator {
  width: 1px;
  height: 20px;
  background: rgba(255, 255, 255, 0.15);
}

.dock-tools {
  display: flex;
  align-items: center;
  gap: 6px;
}

.tool-button {
  background: transparent;
  border: none;
  color: #cbd5e1;
  width: 36px;
  height: 36px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: var(--transition-smooth);
}

.tool-button svg {
  width: 18px;
  height: 18px;
  stroke: currentColor;
  stroke-width: 2;
  fill: none;
}

.tool-button:hover {
  background: rgba(255, 255, 255, 0.12);
  color: #ffffff;
  transform: scale(1.08);
}

.tool-button:active {
  transform: scale(0.94);
}

/* Mobile responsive rules */
@media (max-width: 768px) {
  .viewer-main {
    padding: 10px 8px 80px 8px;
  }
  .nav-arrow {
    width: 48px;
    height: 48px;
  }
  .nav-arrow.prev-arrow {
    left: 10px;
  }
  .nav-arrow.next-arrow {
    right: 10px;
  }
  .nav-arrow svg {
    width: 22px;
    height: 22px;
  }
  .control-dock {
    bottom: 14px;
    padding: 6px 14px;
    gap: 12px;
  }
}

/* Print view */
@media print {
  body {
    background: #ffffff !important;
  }
  .nav-arrow, .control-dock {
    display: none !important;
  }
  .document-page {
    display: block !important;
    opacity: 1 !important;
    transform: none !important;
    page-break-after: always;
  }
  .document-card {
    box-shadow: none !important;
    border: none !important;
  }
}

  </style>
</head>
<body>

  <!-- Navigation Arrows -->
  <!-- Left / Previous Arrow: Hidden on Page 1, Visible on Page 2 & 3 -->
  <button id="prevPageBtn" class="nav-arrow prev-arrow hidden" aria-label="Previous Page" data-tooltip="Previous">
    <svg viewBox="0 0 24 24">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </button>

  <!-- Right / Next Arrow: Visible on Page 1 & 2, Hidden on Page 3 -->
  <button id="nextPageBtn" class="nav-arrow next-arrow" aria-label="Next Page" data-tooltip="Next">
    <svg viewBox="0 0 24 24">
      <polyline points="9 18 15 12 9 6"></polyline>
    </svg>
  </button>

  <!-- Main Document Stage -->
  <main class="viewer-main">
    <div class="document-stage">
      <div class="document-card">
        
        
        <!-- Page 1: Australian Government Visa Document -->
        <section id="page-1" class="document-page active" aria-label="Document Page 1">
          <!-- QR Code placed above document on one side -->

          <div class="image-canvas">
            <img 
              src="/assets/images/page1.jpg" onerror="this.onerror=null; this.src='/page1.jpg';" 
              alt="Australian Government Department of Home Affairs - Temporary Skill Shortage (subclass 482) visa application" 
              class="page-display-img"
              id="docImg1"
            />
          </div>
        </section>

        <!-- Page 2: Employment Contract Page 1 -->
        <section id="page-2" class="document-page" aria-label="Document Page 2">
          <div class="image-canvas">
            <img 
              src="/assets/images/page2.jpg" onerror="this.onerror=null; this.src='/page2.jpg';" 
              alt="Employment Contract - Page 1 terms, workplace, working hours, salary and benefits" 
              class="page-display-img"
              id="docImg2"
            />
          </div>
        </section>

        <!-- Page 3: Employment Contract Page 2 -->
        <section id="page-3" class="document-page" aria-label="Document Page 3">
          <div class="image-canvas">
            <img 
              src="/assets/images/page3.jpg" onerror="this.onerror=null; this.src='/page3.jpg';" 
              alt="Employment Contract - Page 2 position and terms" 
              class="page-display-img"
              id="docImg3"
            />
          </div>
        </section>

      </div>
    </div>
  </main>

  <!-- Floating Bottom Control Dock -->
  <nav class="control-dock" aria-label="Viewer Controls">
    <span class="page-counter-badge" id="pageCounter">Page 1 of 3</span>
    
    <div class="pagination-dots" aria-label="Page dots">
      <span class="page-dot active" data-page="1" title="Go to Page 1"></span>
      <span class="page-dot" data-page="2" title="Go to Page 2"></span>
      <span class="page-dot" data-page="3" title="Go to Page 3"></span>
    </div>

    <div class="dock-separator"></div>

    <div class="dock-tools">
      <button class="tool-button" id="zoomOutBtn" title="Zoom Out (-)" aria-label="Zoom Out">
        <svg viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          <line x1="8" y1="11" x2="14" y2="11"></line>
        </svg>
      </button>

      <button class="tool-button" id="zoomResetBtn" title="Reset Zoom" aria-label="Reset Zoom">
        <svg viewBox="0 0 24 24">
          <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path>
          <path d="M21 3v5h-5"></path>
          <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path>
          <path d="M3 21v-5h5"></path>
        </svg>
      </button>

      <button class="tool-button" id="zoomInBtn" title="Zoom In (+)" aria-label="Zoom In">
        <svg viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          <line x1="11" y1="8" x2="11" y2="14"></line>
          <line x1="8" y1="11" x2="14" y2="11"></line>
        </svg>
      </button>

      <button class="tool-button" id="fullscreenBtn" title="Toggle Fullscreen (F)" aria-label="Toggle Fullscreen">
        <svg viewBox="0 0 24 24">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
        </svg>
      </button>
    </div>
  </nav>

  <script src="/js/app.js"></script>
  <script>
document.addEventListener('DOMContentLoaded', () => {
  const totalPages = 3;
  let currentPage = 1;
  let currentZoom = 1;

  // DOM Elements
  const prevBtn = document.getElementById('prevPageBtn');
  const nextBtn = document.getElementById('nextPageBtn');
  const pageCounter = document.getElementById('pageCounter');
  const pageDots = document.querySelectorAll('.page-dot');
  const pages = document.querySelectorAll('.document-page');
  const zoomInBtn = document.getElementById('zoomInBtn');
  const zoomOutBtn = document.getElementById('zoomOutBtn');
  const zoomResetBtn = document.getElementById('zoomResetBtn');
  const fullscreenBtn = document.getElementById('fullscreenBtn');

  // Initialize page from URL hash if present
  function initPageFromHash() {
    const hash = window.location.hash;
    const match = hash.match(/#page-(d+)/) || hash.match(/#(d+)/);
    if (match && match[1]) {
      const p = parseInt(match[1], 10);
      if (p >= 1 && p <= totalPages) {
        currentPage = p;
      }
    }
  }

  // Update View
  function renderPage() {
    // Reset zoom when navigating
    resetZoom();

    // Show active page, hide others
    pages.forEach((pageEl, idx) => {
      const pageNum = idx + 1;
      if (pageNum === currentPage) {
        pageEl.classList.add('active');
      } else {
        pageEl.classList.remove('active');
      }
    });

    // Arrow Visibility Rules:
    // Page 1: Only NEXT arrow (PREV hidden)
    // Page 2: BOTH PREV and NEXT arrows visible
    // Page 3: Only PREV arrow (NEXT hidden)
    if (currentPage === 1) {
      if (prevBtn) prevBtn.classList.add('hidden');
      if (nextBtn) nextBtn.classList.remove('hidden');
    } else if (currentPage === 2) {
      if (prevBtn) prevBtn.classList.remove('hidden');
      if (nextBtn) nextBtn.classList.remove('hidden');
    } else if (currentPage === 3) {
      if (prevBtn) prevBtn.classList.remove('hidden');
      if (nextBtn) nextBtn.classList.add('hidden');
    }

    // Update Counter badge
    if (pageCounter) {
      pageCounter.textContent = `Page ${currentPage} of ${totalPages}`;
    }

    // Update Pagination Dots
    pageDots.forEach((dot, idx) => {
      if (idx + 1 === currentPage) {
        dot.classList.add('active');
      } else {
        dot.classList.remove('active');
      }
    });

    // Update URL hash without jumping
    history.replaceState(null, '', `#page-${currentPage}`);

    // Scroll to top of document smoothly
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function goToPage(targetPage) {
    if (targetPage >= 1 && targetPage <= totalPages) {
      currentPage = targetPage;
      renderPage();
    }
  }

  function nextPage() {
    if (currentPage < totalPages) {
      goToPage(currentPage + 1);
    }
  }

  function prevPage() {
    if (currentPage > 1) {
      goToPage(currentPage - 1);
    }
  }

  // Zoom controls
  function applyZoom() {
    const activeImg = document.querySelector('.document-page.active .page-display-img');
    if (activeImg) {
      activeImg.style.transform = `scale(${currentZoom})`;
      if (currentZoom > 1) {
        activeImg.classList.add('zoomed');
      } else {
        activeImg.classList.remove('zoomed');
      }
    }
  }

  function zoomIn() {
    if (currentZoom < 2.5) {
      currentZoom = Math.min(2.5, currentZoom + 0.25);
      applyZoom();
    }
  }

  function zoomOut() {
    if (currentZoom > 0.75) {
      currentZoom = Math.max(0.75, currentZoom - 0.25);
      applyZoom();
    }
  }

  function resetZoom() {
    currentZoom = 1;
    applyZoom();
  }

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.warn('Fullscreen error:', err);
      });
    } else {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      }
    }
  }

  // Event Listeners
  if (prevBtn) {
    prevBtn.addEventListener('click', (e) => {
      e.preventDefault();
      prevPage();
    });
  }

  if (nextBtn) {
    nextBtn.addEventListener('click', (e) => {
      e.preventDefault();
      nextPage();
    });
  }

  pageDots.forEach(dot => {
    dot.addEventListener('click', () => {
      const pageNum = parseInt(dot.getAttribute('data-page'), 10);
      if (pageNum) goToPage(pageNum);
    });
  });

  if (zoomInBtn) zoomInBtn.addEventListener('click', zoomIn);
  if (zoomOutBtn) zoomOutBtn.addEventListener('click', zoomOut);
  if (zoomResetBtn) zoomResetBtn.addEventListener('click', resetZoom);
  if (fullscreenBtn) fullscreenBtn.addEventListener('click', toggleFullscreen);

  // Click image to toggle zoom
  pages.forEach(p => {
    const img = p.querySelector('.page-display-img');
    if (img) {
      img.addEventListener('click', () => {
        if (currentZoom === 1) {
          currentZoom = 1.6;
        } else {
          currentZoom = 1;
        }
        applyZoom();
      });
    }
  });

  // Keyboard navigation
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'PageDown') {
      nextPage();
    } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
      prevPage();
    } else if (e.key === 'Home') {
      goToPage(1);
    } else if (e.key === 'End') {
      goToPage(totalPages);
    } else if (e.key === 'f' || e.key === 'F') {
      toggleFullscreen();
    }
  });

  // Touch swipe gesture support
  let touchStartX = 0;
  let touchStartY = 0;
  window.addEventListener('touchstart', (e) => {
    touchStartX = e.changedTouches[0].screenX;
    touchStartY = e.changedTouches[0].screenY;
  }, { passive: true });

  window.addEventListener('touchend', (e) => {
    const touchEndX = e.changedTouches[0].screenX;
    const touchEndY = e.changedTouches[0].screenY;
    const diffX = touchEndX - touchStartX;
    const diffY = touchEndY - touchStartY;

    // Horizontal swipe threshold: 50px, more horizontal than vertical
    if (Math.abs(diffX) > 50 && Math.abs(diffX) > Math.abs(diffY)) {
      if (diffX < 0) {
        // Swipe Left -> Next
        nextPage();
      } else {
        // Swipe Right -> Prev
        prevPage();
      }
    }
  }, { passive: true });

  // Handle browser back/forward buttons
  window.addEventListener('popstate', () => {
    initPageFromHash();
    renderPage();
  });

  // Initial render
  initPageFromHash();
  renderPage();
});

  </script>
</body>
</html>
